<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color">   <!-- a cor vem do tema (script abaixo) -->
<title>psascan</title>
<link rel="icon" href="/static/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/vendor/uplot/uPlot.min.css">
<link rel="stylesheet" href="/api/tema.css" id="tema-css">
<link rel="stylesheet" href="/static/app.css">
<script>try{if(localStorage.getItem('psascan.tema')==='light')document.documentElement.dataset.theme='light'}catch(e){}
document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()</script>
</head>
<body>
<div class="app">
  <nav class="lateral" id="nav"></nav>
  <main>
    <header class="topo">
      <div class="titulo" id="titulo">Painel</div>
      <span class="chip" id="chip-con" title="Conexão com o scanner"><i class="ponto"></i><span id="con-txt">desconectado</span></span>
      <span class="chip rec oculto" id="chip-rec" title="Gravando sessão"><i class="ponto"></i><span class="rotulo-longo">REC</span> <b class="num" id="rec-tempo">0:00</b></span>
      <div class="seg esconder-cel" id="ler-modo" role="group" aria-label="Modo de leitura">
        <button data-modo="rapido" title="Só o bloco da lambda: menos parâmetros, mais amostras por segundo">Rápido</button>
        <button data-modo="completo" title="Todos os blocos: todos os parâmetros">Completo</button>
      </div>
      <button class="btn pri" id="btn-ler"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg><span class="rotulo-longo">Ler</span></button>
      <button class="btn fantasma esconder-cel" id="btn-tema" title="Mudar para o tema claro" aria-label="Mudar para o tema claro"><svg class="ic-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><svg class="ic-lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg></button>
    </header>
    <div id="faixa-atuador"></div>
    <div class="conteudo" id="tela"></div>
  </main>
</div>
<nav class="inferior" id="nav-cel"></nav>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog id="dlg-confirmar">
  <h2 id="dlg-titulo">Confirmar envio</h2>
  <details id="dlg-bytes"><summary>ver os bytes enviados ao scanner</summary><ol id="dlg-lista"></ol></details>
  <div id="dlg-extra"></div>
  <div class="acoes"><button class="btn" id="dlg-nao">Cancelar</button><button class="btn pri" id="dlg-sim">Enviar</button></div>
</dialog>
<script src="/static/vendor/uplot/uPlot.iife.min.js"></script>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
